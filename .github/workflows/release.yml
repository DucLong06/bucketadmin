name: Release

# Push a tag like v0.1.0 or v0.1.0-preview1 to build the .deb and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    # Oldest supported Ubuntu: the binary then runs on 22.04 and newer (glibc is forward compatible only).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (build + render gate)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev pkg-config xvfb ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # v0.1.0-preview1 -> 0.1.0~preview1 ("~" sorts before the final 0.1.0 in dpkg; git tags cannot contain it).
      - name: Debian version from the tag
        id: version
        run: echo "deb=$(printf '%s' "${GITHUB_REF_NAME#v}" | tr '-' '~')" >> "$GITHUB_OUTPUT"

      - name: Build the .deb
        run: scripts/build-deb.sh "${{ steps.version.outputs.deb }}"

      - name: Render gate (the packaged binary must show the real UI)
        run: scripts/render-gate.sh bucketadmin_*.deb

      - name: Keep the render gate screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-gate
          path: /tmp/ba-m2/render.png
          if-no-files-found: ignore

      # GitHub renames "~" in asset names to ".", so a preview asset is listed as
      # bucketadmin_0.1.0.preview1_amd64.deb; the version inside the package is unchanged.
      - name: Attach the .deb to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bucketadmin_*.deb
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
