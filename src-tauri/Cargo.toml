[package]
name = "bucketadmin"
version = "0.1.0"
description = "Ceph RGW admin & browse desktop"
edition = "2021"

[lib]
name = "bucketadmin_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
# Linux Secret Service over libdbus; crypto-rust keeps openssl out
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# rustls + system trust store (internal CAs); no openssl
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
