[package]
name = "bucketadmin"
version = "0.1.4"
description = "Ceph RGW admin & browse desktop"
edition = "2021"

[lib]
name = "bucketadmin_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
# already in the tree via reqwest; decodes the bucket policy attr
base64 = "0.22"
# already in the tree via reqwest/tauri; used for bounded-concurrency user loading
futures-util = "0.3"
# S3 browsing with a user's own key (path-style); rustls, no openssl
aws-sdk-s3 = "1"
# already in the tree via aws-sdk-s3 (same features); named here to choose the S3 client's proxy
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
# file streaming for transfers; the runtime itself is Tauri's
tokio = { version = "1", features = ["fs", "io-util"] }
# Parquet preview through ranged reads: footer + only the pages a view needs
parquet = { version = "60", default-features = false, features = ["arrow", "async", "snap", "zstd", "flate2-rust_backend", "lz4"] }
arrow-json = "60"
# already in the tree; the buffer type of the Parquet reader interface
bytes = "1"
# native open/save dialogs for upload and download
tauri-plugin-dialog = "2"
# audit log; bundled = no system libsqlite needed
rusqlite = { version = "0.32", features = ["bundled"] }
# Linux Secret Service over libdbus; crypto-rust keeps openssl out
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# rustls + system trust store (internal CAs); no openssl
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# builds the Parquet files the lab tests read back
arrow-array = "60"
arrow-schema = "60"

[lints.rust]
unsafe_code = "forbid"

[features]
# Serve the embedded frontend instead of build.devUrl. `tauri build` turns on tauri/custom-protocol
# by itself; this alias is for a plain `cargo build --release --features custom-protocol`.
# Without it a hand-built binary opens a blank "Could not connect to localhost" window.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
